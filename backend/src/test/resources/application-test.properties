spring.application.name=transitease-backend

# Test Profile DataSource (In-Memory H2 Database)
spring.datasource.url=jdbc:h2:mem:transitease_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for test profile
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Test JWT configuration
jwt.secret=TransitEaseSecretKeyForJwtAuthenticationTransitEase2026SecurityKey!
jwt.expiration-ms=86400000

# File Upload Directory for tests
file.upload-dir=target/test-uploads
